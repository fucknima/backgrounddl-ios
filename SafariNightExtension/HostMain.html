<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<link rel="stylesheet" href="../Style.css">
<title>智夜 · Safari 深色模式</title>
</head>
<body>
<main>
  <picture>
    <source srcset="../Icon-Dark.png" media="(prefers-color-scheme: dark)">
    <img src="../Icon.png" alt="智夜图标" width="112" height="112">
  </picture>
  <h1>智夜</h1>
  <p>基于开源 Dark Reader 的 Safari 智能夜间模式</p>
  <section>
    <strong>启用 Safari 扩展</strong>
    <p>前往「设置 → App → Safari → 扩展」打开「智夜」，允许访问需要处理的网站。</p>
    <p>在 Safari 的扩展菜单里选择「智能深色」「始终深色」或「网站原样」。</p>
  </section>
</main>
</body>
</html>
