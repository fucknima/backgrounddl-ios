name: 构建Safari智夜插件

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "SafariNightExtension/**"
      - ".github/workflows/build-safari-night.yml"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check tools and validate manifest
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          if xcrun --find safari-web-extension-packager >/dev/null 2>&1; then
            echo "Using Safari web extension packager"
          elif xcrun --find safari-web-extension-converter >/dev/null 2>&1; then
            echo "Using legacy Safari web extension converter"
          else
            echo "::error::Neither Apple Safari Web Extension CLI is available with this Xcode"
            exit 1
          fi
          plutil -lint -s -r SafariNightExtension/manifest.json || python3 -m json.tool SafariNightExtension/manifest.json >/dev/null

      - name: Create official Safari Web Extension Xcode project
        shell: bash
        run: |
          set -euo pipefail
          TOOL=safari-web-extension-packager
          xcrun --find "$TOOL" >/dev/null 2>&1 || TOOL=safari-web-extension-converter
          xcrun "$TOOL" "$GITHUB_WORKSPACE/SafariNightExtension" \
            --project-location "$RUNNER_TEMP/SafariNightXcode" \
            --app-name "SafariNight" \
            --bundle-identifier "io.github.fucknima.safarinight" \
            --ios-only --swift --copy-resources --no-open --no-prompt
          find "$RUNNER_TEMP/SafariNightXcode" -maxdepth 5 -name '*.xcodeproj' -print

      - name: Build unsigned iOS app and embedded Safari extension
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$(find "$RUNNER_TEMP/SafariNightXcode" -name '*.xcodeproj' -type d -print -quit)"
          test -n "$PROJECT"
          export PROJECT
          xcodebuild -list -json -project "$PROJECT" > "$RUNNER_TEMP/schemes.json"
          SCHEME="$(python3 -c 'import json,os; d=json.load(open(os.environ["RUNNER_TEMP"]+"/schemes.json")); schemes=d["project"]["schemes"]; names=[n for n in schemes if "Extension" not in n and "扩展" not in n]; print((names or schemes)[0])')"
          echo "Building scheme: $SCHEME"
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee "$RUNNER_TEMP/build.log"

      - name: Package IPA and verify embedded extension
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -d "$APP"
          test -d "$APP/PlugIns"
          find "$APP/PlugIns" -maxdepth 1 -name '*.appex' -type d | grep -q .
          echo "App: $APP"
          find "$APP/PlugIns" -name manifest.json -print
          mkdir -p "$RUNNER_TEMP/PayloadBuild/Payload"
          cp -R "$APP" "$RUNNER_TEMP/PayloadBuild/Payload/"
          (cd "$RUNNER_TEMP/PayloadBuild" && zip -qry "$GITHUB_WORKSPACE/SafariNight-unsigned.ipa" Payload)
          test -s "$GITHUB_WORKSPACE/SafariNight-unsigned.ipa"
          unzip -l "$GITHUB_WORKSPACE/SafariNight-unsigned.ipa" | grep -F '.appex/' | head -n 1

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: SafariNight-unsigned-IPA
          path: SafariNight-unsigned.ipa
          retention-days: 14
          if-no-files-found: error
