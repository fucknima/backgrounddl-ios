name: Build BackgroundDL iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Inspect Xcode project
        run: |
          xcodebuild -version
          xcodebuild -list -project BackgroundDL.xcodeproj
          plutil -lint BackgroundDL.xcodeproj/project.pbxproj BackgroundDL/Info.plist BackgroundDLLiveActivity/Info.plist BackgroundDLShareExtension/Info.plist BackgroundDL/BackgroundDL.entitlements BackgroundDLShareExtension/ShareExtension.entitlements
      - name: Render new 1024px light and dark app icons
        run: |
          swift Tools/GenerateIcons.swift
          sips -g pixelWidth -g pixelHeight BackgroundDL/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png BackgroundDL/Assets.xcassets/AppIcon.appiconset/AppIcon-Dark-1024.png
      - name: Run byte-range validator tests
        run: |
          swiftc BackgroundDL/RangeSupport.swift BackgroundDL/Models.swift Tests/main.swift -o /tmp/bgdl-range-tests
          /tmp/bgdl-range-tests
      - name: Check three-tab UI and menu icon regressions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          content = Path("BackgroundDL/ContentView.swift").read_text()
          browser = Path("BackgroundDL/BrowserView.swift").read_text()
          assert "case browser, downloads, settings" in content
          assert "MainTab.files" not in content
          assert "LocalDownloadFilesView" not in content
          assert 'Label("下载模式", systemImage: "arrow.down.circle")' in content
          assert 'Label("排序方式", systemImage: "arrow.up.arrow.down")' in content
          assert "智能模式只在系统深色且网页背景偏亮时自动变暗；复杂网页可切回原样。" not in browser
          print("PASS: three tabs, menu icons and no explanatory menu row")
          PY
      - name: Validate iOS 26 progress fallback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import plistlib
          root = plistlib.loads(Path("BackgroundDL/Info.plist").read_bytes())
          assert any("downloadProgress" in x for x in root["BGTaskSchedulerPermittedIdentifiers"])
          src = Path("BackgroundDL/DownloadActivityManager.swift").read_text()
          assert "#available(iOS 26.0, *)" in src
          assert "Activity<DownloadActivityAttributes>.activities" in src
          assert "BGContinuedProcessingTaskRequest" in src
          ui = Path("BackgroundDL/ContentView.swift").read_text()
          assert "DownloadDeleteSheet" not in ui
          assert "pendingDeletion" not in ui
          print("PASS: iOS 26 system progress and legacy fallback")
          PY
      - name: Validate compact scroll views and delete path
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path("BackgroundDL/ContentView.swift").read_text()
          browser = Path("BackgroundDL/BrowserView.swift").read_text()
          assert "func deleteImmediately(id: UUID, deleteFile: Bool)" in src
          assert "DownloadDeleteSheet" not in src
          assert "pendingDeletion" not in src
          assert "NativeDownloadList" in src
          assert "trailingSwipeActionsConfigurationForRowAt" in src
          assert "CompactDownloadRow(" in src
          assert "settingsCard(" in src
          assert ".navigationBarTitleDisplayMode(.inline)" in src
          assert 'Text("把链接变成下载")' in browser
          assert 'Text("浏览器主页").font(.largeTitle.bold())' not in browser
          print("PASS: scroll-view pages, delete path and compact screens")
          PY
      - name: Validate captured download banner navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("BackgroundDL/ContentView.swift").read_text()
          browser = Path("BackgroundDL/BrowserView.swift").read_text()
          assert "BrowserView(sharedURL: sharedURL, openDownloads:" in root
          assert "selectedTab = .downloads" in root
          assert "let openDownloads: () -> Void" in browser
          assert 'state.notice = ""\n                openDownloads()' in browser
          assert "capturedDownloadNotice" in browser
          assert 'Text("点击查看下载进度")' in browser
          assert 'state.notice = "已接管：' in browser
          print("PASS: tap captured-download notice switches tab and clears banner")
          PY
      - name: Validate URL drag and home-icon registration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import plistlib
          plist = plistlib.loads(Path("BackgroundDL/Info.plist").read_bytes())
          assert "CFBundleDocumentTypes" not in plist
          web = [entry for entry in plist.get("CFBundleURLTypes", [])
                 if "http" in entry.get("CFBundleURLSchemes", [])]
          assert web, "missing http URL type"
          assert all(entry.get("CFBundleTypeRole") == "Editor" for entry in web)
          assert {"http", "https", "backgrounddl"} <= {scheme for entry in web for scheme in entry["CFBundleURLSchemes"]}
          app = Path("BackgroundDL/ContentView.swift").read_text()
          browser = Path("BackgroundDL/BrowserView.swift").read_text()
          assert '.onOpenURL { url in incomingRouter.receive(url, from: "SwiftUI onOpenURL") }' in app
          assert "RootDropInstaller" in app
          assert "UIDropInteraction(delegate: self)" in app
          assert "session.hasItemsConforming(toTypeIdentifiers:" in app
          assert 'Text("松手打开链接")' in app
          assert "incomingLinkRevision = UUID()" in app
          assert "private func importDrop(" in app
          assert 'incomingLinkRevision: incomingLinkRevision' in app
          assert ".onChange(of: incomingLinkRevision)" in browser
          assert 'let incomingLinkRevision: UUID' in browser
          print("PASS: document type registration, URL callback, cross-app drop and duplicate-link handling")
          PY
      - name: Validate drag-drop ingestion diagnostics and cold launch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          app = Path("BackgroundDL/BackgroundDLApp.swift").read_text()
          content = Path("BackgroundDL/ContentView.swift").read_text()
          browser = Path("BackgroundDL/BrowserView.swift").read_text()
          assert "IncomingLinkRouter" in app
          assert "IncomingLinkDecoder" in app
          assert "startAccessingSecurityScopedResource()" in app
          assert "PropertyListSerialization.propertyList" in app
          assert "AppDelegate openURL" in app
          assert "func application(_ application: UIApplication," in app
          assert ".onContinueUserActivity(NSUserActivityTypeBrowsingWeb)" in content
          assert "onChange(of: incomingRouter.revision)" in content
          assert 'settingsCard("拖放诊断")' not in content
          assert 'acceptDroppedProviders:' in browser
          print("PASS: cold and warm URL entry points, Internet Location parsing, diagnostics")
          PY
      - name: Verify SceneDelegate cold start and URL routing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path("BackgroundDL/BackgroundDLApp.swift").read_text()
          assert "configurationForConnecting connectingSceneSession" in src
          assert "configuration.delegateClass = DownloadSceneDelegate.self" in src
          assert "final class DownloadSceneDelegate: NSObject, UIWindowSceneDelegate" in src
          assert "connectionOptions.urlContexts" in src
          assert "connectionOptions.userActivities" in src
          assert "openURLContexts URLContexts" in src
          assert "Scene 冷启动" in src
          assert "IncomingLinkRouter.shared.receive(context.url" in src
          print("PASS: Scene cold and warm URL entry points")
          PY
      - name: Verify real NSItemProvider URL and plain-text decoding
        run: |
          set -euo pipefail
          swiftc -parse-as-library BackgroundDL/DroppedLinkReader.swift Tests/DropLinkTests.swift -o /tmp/bgdl-drop-tests
          /tmp/bgdl-drop-tests
          python3 - <<'PY'
          from pathlib import Path
          source = Path("BackgroundDL/ContentView.swift").read_text()
          assert "DroppedLinkReader.load(providers: providers" in source
          assert 'provider.loadItem(forTypeIdentifier: type' not in source
          reader = Path("BackgroundDL/DroppedLinkReader.swift").read_text()
          assert "provider.loadObject(ofClass: URL.self)" in reader
          assert "UTType.utf8PlainText.identifier" in reader
          assert "provider.loadDataRepresentation" in reader
          print("PASS: app uses tested multi-representation reader")
          PY
      - name: Build without code signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project BackgroundDL.xcodeproj \
            -scheme BackgroundDL -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/.derivedData" \
            CODE_SIGNING_ALLOWED=NO build
          APP="$PWD/.derivedData/Build/Products/Release-iphoneos/BackgroundDL.app"
          test -d "$APP"
          test -d "$APP/PlugIns/BackgroundDLLiveActivityExtension.appex"
          test -f "$APP/PlugIns/BackgroundDLLiveActivityExtension.appex/BackgroundDLLiveActivityExtension"
          test -d "$APP/PlugIns/BackgroundDLShareExtension.appex"
          test -f "$APP/PlugIns/BackgroundDLShareExtension.appex/BackgroundDLShareExtension"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr BackgroundDL-unsigned.ipa Payload
          unzip -tqq BackgroundDL-unsigned.ipa
      - name: Commit generated icon artwork
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BackgroundDL/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png BackgroundDL/Assets.xcassets/AppIcon.appiconset/AppIcon-Dark-1024.png
          if ! git diff --cached --quiet; then
            git commit -m "Render refreshed light/dark app icons [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BackgroundDL-unsigned
          path: BackgroundDL-unsigned.ipa
          if-no-files-found: error
