name: Build unsigned iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcodebuild -version
          xcodebuild -list -project BackgroundDL.xcodeproj

      - name: Inject optional Google OAuth settings
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_URL_SCHEME: ${{ secrets.GOOGLE_URL_SCHEME }}
        shell: bash
        run: |
          if [[ -n "$GOOGLE_CLIENT_ID" && -n "$GOOGLE_URL_SCHEME" ]]; then
            /usr/libexec/PlistBuddy -c "Set :GIDClientID $GOOGLE_CLIENT_ID" BackgroundDL/Info.plist
            /usr/libexec/PlistBuddy -c "Set :CFBundleURLTypes:0:CFBundleURLSchemes:0 $GOOGLE_URL_SCHEME" BackgroundDL/Info.plist
          else
            echo "Google OAuth secrets not configured; HTTPS direct downloads work, Drive sign-in will not."
          fi

      - name: Build without code signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project BackgroundDL.xcodeproj \
            -target BackgroundDL -configuration Release -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="$PWD/build/Release-iphoneos" \
            CODE_SIGNING_ALLOWED=NO build
          mkdir -p Payload
          cp -R build/Release-iphoneos/BackgroundDL.app Payload/
          zip -qr BackgroundDL-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: BackgroundDL-unsigned
          path: BackgroundDL-unsigned.ipa
          if-no-files-found: error
