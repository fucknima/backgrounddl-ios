name: Build BackgroundDL iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Inspect Xcode project
        run: |
          xcodebuild -version
          xcodebuild -list -project BackgroundDL.xcodeproj
          plutil -lint BackgroundDL.xcodeproj/project.pbxproj BackgroundDL/Info.plist BackgroundDLLiveActivity/Info.plist BackgroundDLShareExtension/Info.plist BackgroundDL/BackgroundDL.entitlements BackgroundDLShareExtension/ShareExtension.entitlements
      - name: Build without code signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project BackgroundDL.xcodeproj \
            -scheme BackgroundDL -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/.derivedData" \
            CODE_SIGNING_ALLOWED=NO build
          APP="$PWD/.derivedData/Build/Products/Release-iphoneos/BackgroundDL.app"
          test -d "$APP"
          test -d "$APP/PlugIns/BackgroundDLLiveActivityExtension.appex"
          test -f "$APP/PlugIns/BackgroundDLLiveActivityExtension.appex/BackgroundDLLiveActivityExtension"
          test -f "$APP/PlugIns/BackgroundDLShareExtension.appex/BackgroundDLShareExtension"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr BackgroundDL-unsigned.ipa Payload
          unzip -tqq BackgroundDL-unsigned.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BackgroundDL-unsigned
          path: BackgroundDL-unsigned.ipa
          if-no-files-found: error
